[project]
name = "template-bluetape"
version = "0.1.0"
description = "Template base para os robos de RPA da Bluetape"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "google-api-python-client>=2.179.0",
    "logger",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pipreqs>=0.5.0",
    "python-dotenv>=1.1.1",
    "pytz>=2025.2",
    "selenium>=4.35.0",
]

[tool.uv.workspace]
members = [
    "Logger",
]

[tool.uv.sources]
logger = { git = "https://github.com/bluetapesd/Logger" }
